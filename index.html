<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>NobleMeter</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f4f1;color:#171717}.app{width:min(92vw,430px);padding:28px 20px 40px;margin:auto;text-align:center}.title{font-size:32px;font-weight:850;letter-spacing:-1px}.sub{font-size:13px;color:#666;margin:3px 0 22px}.dial{width:245px;height:245px;margin:auto;border:6px solid #222;border-radius:50%;display:flex;flex-direction:column;justify-content:center;background:#fff;box-shadow:0 10px 30px #0001}.noble{font-size:76px;font-weight:850;line-height:1}.unit{font-size:14px;letter-spacing:2px;color:#666;font-weight:700}.temps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.box{text-align:left}.box label{font-size:13px;color:#666}.input{margin-top:5px;background:#fff;border:1px solid #ccc;border-radius:13px;padding:11px;display:flex;align-items:center}.input input{border:0;outline:0;width:100%;font-size:24px;background:transparent}.slider{width:100%;margin:24px 0 8px}.anchors{display:flex;justify-content:space-between;font-size:11px;color:#777}.btn{width:100%;margin-top:18px;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:750;background:#171717;color:white}.forecastBtn{background:#fff;color:#171717;border:2px solid #171717}.note{font-size:11px;color:#888;margin-top:13px}.forecast{display:none;margin-top:22px;text-align:left}.forecast h2{font-size:22px;margin:0 0 12px}.search{display:flex;gap:8px}.search input{min-width:0;flex:1;border:1px solid #bbb;border-radius:13px;padding:12px;font-size:16px}.search button{border:0;border-radius:13px;padding:0 15px;background:#171717;color:#fff;font-weight:750}.place{font-size:13px;color:#666;margin:10px 2px}.days{display:grid;gap:8px}.day{background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px;display:grid;grid-template-columns:1.2fr 1fr 1fr;align-items:center}.dayname{font-weight:800}.weather{font-size:12px;color:#666;margin-top:2px}.temp{text-align:center;font-size:14px}.nobleDay{text-align:right;font-size:20px;font-weight:850}.status{text-align:center;color:#666;padding:15px;font-size:14px}.source{text-align:center;font-size:10px;color:#999;margin-top:10px}
</style>
</head>
<body><main class="app">
<div class="title">NobleMeter</div><div class="sub">The Sheldon Noble Temperature Conversion Scale</div>
<div class="dial"><div class="unit">NOBLE</div><div id="noble" class="noble">0</div><div id="readout" class="unit">0°C · 32°F</div></div>
<div class="temps"><div class="box"><label>Celsius</label><div class="input"><input id="c" type="number" value="0" step="0.1"><span>°C</span></div></div><div class="box"><label>Fahrenheit</label><div class="input"><input id="f" type="number" value="32" step="0.1"><span>°F</span></div></div></div>
<input id="slider" class="slider" type="range" min="-50" max="38" value="0" step="0.1">
<div class="anchors"><span>−50°C = −100</span><span>0°C = 0</span><span>38°C = +100</span></div>
<button id="forecastBtn" class="btn forecastBtn">7-Day Noble Forecast</button>
<section id="forecast" class="forecast"><h2>Noble Forecast</h2><div class="search"><input id="location" placeholder="City or postal code" autocomplete="off"><button id="go">Go</button></div><div id="place" class="place"></div><div id="days" class="days"></div><div class="source">Forecast data: Open-Meteo</div></section>
<button id="share" class="btn">Share NobleMeter</button><div class="note">A Noble conversion scale: below 0°C, 2 Noble/°C; above 0°C, 100/38 Noble/°C.</div>
</main><script>
const $=id=>document.getElementById(id),c=$('c'),f=$('f'),s=$('slider'),n=$('noble'),r=$('readout');
function snapZero(C){return Math.abs(C)<0.05?0:C}
function noble(C){C=snapZero(C);return C===0?0:(C<0?C*2:C*(100/38))}
function ctof(C){return C*9/5+32} function ftoc(F){return(F-32)*5/9}
function fmt(x,d=1){x=snapZero(x);return Number(x.toFixed(d)).toString()}
function nobleFmt(C){const N=Math.round(noble(C));return N===0?'0':(N>0?'+':'')+N}
function render(rawC,src){if(!Number.isFinite(rawC))return;const C=snapZero(rawC),F=ctof(C),N=noble(C);n.textContent=C===0?'0':(N>0?'+':'')+Math.round(N);r.textContent=`${fmt(C)}°C · ${fmt(F)}°F`;if(src!=='c'||C===0)c.value=fmt(C);if(src!=='f'||C===0)f.value=fmt(F);s.value=Math.max(-50,Math.min(38,C))}
c.addEventListener('input',()=>render(Number(c.value),'c'));f.addEventListener('input',()=>render(ftoc(Number(f.value)),'f'));s.addEventListener('input',()=>render(Number(s.value),'s'));
const weatherNames={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
$('forecastBtn').addEventListener('click',()=>{const el=$('forecast');el.style.display=el.style.display==='block'?'none':'block';if(el.style.display==='block')$('location').focus()});
$('location').addEventListener('keydown',e=>{if(e.key==='Enter')loadForecast()});$('go').addEventListener('click',loadForecast);
async function loadForecast(){const q=$('location').value.trim();if(!q)return;$('place').textContent='Finding '+q+'…';$('days').innerHTML='';try{const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);const gj=await g.json();if(!gj.results?.length)throw new Error('Location not found');const p=gj.results[0];$('place').textContent=[p.name,p.admin1,p.country].filter(Boolean).join(', ');const u=`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7`;const w=await fetch(u);const j=await w.json();if(!j.daily)throw new Error('Forecast unavailable');$('days').innerHTML=j.daily.time.map((date,i)=>{const hi=j.daily.temperature_2m_max[i],lo=j.daily.temperature_2m_min[i],d=new Date(date+'T12:00:00'),day=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}),wx=weatherNames[j.daily.weather_code[i]]||'Forecast';return `<div class="day"><div><div class="dayname">${day}</div><div class="weather">${wx}</div></div><div class="temp">${Math.round(lo)}° / ${Math.round(hi)}°C<br>${Math.round(ctof(lo))}° / ${Math.round(ctof(hi))}°F</div><div class="nobleDay">${nobleFmt(lo)} / ${nobleFmt(hi)}<div class="weather">Noble</div></div></div>`}).join('')}catch(e){$('place').textContent=e.message==='Location not found'?'Location not found. Try a city name.':'Could not load the forecast. Try again.'}}
$('share').addEventListener('click',async()=>{const data={title:'NobleMeter',text:'Try the Sheldon Noble Temperature Conversion Scale',url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);alert('NobleMeter link copied.');}}catch(e){}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render(0);
</script></body></html>
