<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>NobleMeter</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 0,#162535 0,#09131e 42%,#050b11 100%);color:#eef4fa}.app{width:min(94vw,460px);padding:24px 18px 44px;margin:auto;text-align:center}.brand{display:flex;align-items:center;justify-content:center;gap:11px}.link{font-size:38px;filter:grayscale(1);text-shadow:0 2px 8px #000}.title{font-size:32px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.sub{font-size:12px;letter-spacing:2px;color:#aab6c2;margin:2px 0 22px;text-transform:uppercase}.sprocket{width:270px;height:270px;margin:auto;border-radius:50%;padding:17px;background:repeating-conic-gradient(from 0deg,#b9b2a5 0 5deg,#5d5a55 5deg 10deg,#d7d0c3 10deg 15deg);box-shadow:0 12px 35px #000b,inset 0 0 0 3px #d9c6a0}.dial{height:100%;border-radius:50%;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle,#162536 0,#09131e 70%);border:5px solid #121820;box-shadow:inset 0 0 35px #000}.noble{font-size:78px;font-weight:900;line-height:1;color:#f2d06b;text-shadow:0 2px 8px #000}.unit{font-size:13px;letter-spacing:3px;color:#b9c4cf;font-weight:800}.temps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.box{text-align:left;background:#0d1925;border:1px solid #34485c;border-radius:15px;padding:10px 12px}.box label{font-size:11px;color:#8ea1b3;text-transform:uppercase;letter-spacing:1px}.input{display:flex;align-items:center}.input input{border:0;outline:0;width:100%;font-size:25px;font-weight:750;color:#fff;background:transparent}.slider{width:100%;margin:22px 0 8px;accent-color:#d3a73f}.anchors{display:flex;justify-content:space-between;font-size:10px;color:#8fa0af}.btn{width:100%;margin-top:17px;border:1px solid #52677b;border-radius:999px;padding:14px;font-size:16px;font-weight:800;background:#111f2d;color:white}.forecastBtn{border-color:#b99039;color:#f1d078}.note{font-size:10px;color:#778897;margin-top:12px}.forecast{display:none;margin-top:20px;text-align:left;background:#091521;border:1px solid #34495d;border-radius:20px;padding:16px}.forecast h2{font-size:20px;margin:0 0 12px;color:#f0d173}.search{display:flex;gap:7px}.search input{min-width:0;flex:1;border:1px solid #4b6074;border-radius:12px;padding:11px;font-size:16px;background:#07111b;color:white}.search button{border:0;border-radius:12px;padding:0 15px;background:#b68b32;color:#07111b;font-weight:900}.place{font-size:12px;color:#9eafbf;margin:10px 2px}.days{display:grid;gap:7px}.day{background:#0e1d2a;border:1px solid #2e4254;border-radius:12px;padding:10px;display:grid;grid-template-columns:1.15fr 1fr 1fr;align-items:center}.dayname{font-weight:850}.weather{font-size:11px;color:#8fa0af;margin-top:2px}.temp{text-align:center;font-size:13px}.nobleDay{text-align:right;font-size:18px;font-weight:900;color:#f0c95f}.source{text-align:center;font-size:9px;color:#66798a;margin-top:9px}@media(max-width:360px){.sprocket{width:245px;height:245px}.title{font-size:27px}}
</style></head><body><main class="app"><div class="brand"><div class="link">🔗</div><div class="title">NobleMeter</div></div><div class="sub">Temperature. In Noble terms.</div><div class="sprocket"><div class="dial"><div class="unit">NOBLE</div><div id="noble" class="noble">0</div><div id="readout" class="unit">0°C · 32°F</div></div></div><div class="temps"><div class="box"><label>Celsius</label><div class="input"><input id="c" type="number" value="0" step="0.1"><span>°C</span></div></div><div class="box"><label>Fahrenheit</label><div class="input"><input id="f" type="number" value="32" step="0.1"><span>°F</span></div></div></div><input id="slider" class="slider" type="range" min="-50" max="38" value="0" step="0.1"><div class="anchors"><span>−50°C = −100</span><span>0°C = 0</span><span>38°C = +100</span></div><button id="forecastBtn" class="btn forecastBtn">7-Day Noble Forecast</button><section id="forecast" class="forecast"><h2>🔗 7-Day Noble Forecast</h2><div class="search"><input id="location" placeholder="City or Canadian postal code" autocomplete="off"><button id="go">Search</button></div><div id="place" class="place"></div><div id="days" class="days"></div><div class="source">Forecast data: Open-Meteo</div></section><button id="share" class="btn">Share NobleMeter</button><div class="note">Below 0°C: 2 Noble/°C · Above 0°C: 100/38 Noble/°C</div></main><script>
const $=id=>document.getElementById(id),c=$('c'),f=$('f'),s=$('slider'),n=$('noble'),r=$('readout');function snapZero(C){return Math.abs(C)<.05?0:C}function noble(C){C=snapZero(C);return C===0?0:C<0?C*2:C*(100/38)}function ctof(C){return C*9/5+32}function ftoc(F){return(F-32)*5/9}function fmt(x,d=1){x=snapZero(x);return Number(x.toFixed(d)).toString()}function nobleFmt(C){const N=Math.round(noble(C));return N===0?'0':(N>0?'+':'')+N}function render(rawC,src){if(!Number.isFinite(rawC))return;const C=snapZero(rawC),F=ctof(C),N=noble(C);n.textContent=C===0?'0':(N>0?'+':'')+Math.round(N);r.textContent=`${fmt(C)}°C · ${fmt(F)}°F`;if(src!=='c'||C===0)c.value=fmt(C);if(src!=='f'||C===0)f.value=fmt(F);s.value=Math.max(-50,Math.min(38,C))}c.addEventListener('input',()=>render(Number(c.value),'c'));f.addEventListener('input',()=>render(ftoc(Number(f.value)),'f'));s.addEventListener('input',()=>render(Number(s.value),'s'));
const weatherNames={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};$('forecastBtn').addEventListener('click',()=>{const el=$('forecast');el.style.display=el.style.display==='block'?'none':'block';if(el.style.display==='block')$('location').focus()});$('location').addEventListener('keydown',e=>{if(e.key==='Enter')loadForecast()});$('go').addEventListener('click',loadForecast);
async function findLocation(q){const compact=q.toUpperCase().replace(/\s+/g,'');const isCanadian=/^[ABCEGHJ-NPRSTVXY]\d[ABCEGHJ-NPRSTVWXYZ]\d[ABCEGHJ-NPRSTVWXYZ]\d$/.test(compact);if(isCanadian){const pretty=compact.slice(0,3)+' '+compact.slice(3);let z=await fetch(`https://api.zippopotam.us/CA/${encodeURIComponent(pretty)}`);if(!z.ok)z=await fetch(`https://api.zippopotam.us/CA/${encodeURIComponent(compact.slice(0,3))}`);if(z.ok){const j=await z.json(),p=j.places?.[0];if(p)return{latitude:Number(p.latitude),longitude:Number(p.longitude),label:[pretty,p['place name'],p.state,'Canada'].filter(Boolean).join(', ')}}}const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`),gj=await g.json();if(!gj.results?.length)throw new Error('Location not found');const p=gj.results[0];return{latitude:p.latitude,longitude:p.longitude,label:[p.name,p.admin1,p.country].filter(Boolean).join(', ')}}
async function loadForecast(){const q=$('location').value.trim();if(!q)return;$('place').textContent='Finding '+q+'…';$('days').innerHTML='';try{const p=await findLocation(q);$('place').textContent=p.label;const u=`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7`;const w=await fetch(u),j=await w.json();if(!j.daily)throw new Error('Forecast unavailable');$('days').innerHTML=j.daily.time.map((date,i)=>{const hi=j.daily.temperature_2m_max[i],lo=j.daily.temperature_2m_min[i],d=new Date(date+'T12:00:00'),day=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}),wx=weatherNames[j.daily.weather_code[i]]||'Forecast';return `<div class="day"><div><div class="dayname">${day}</div><div class="weather">${wx}</div></div><div class="temp">${Math.round(lo)}° / ${Math.round(hi)}°C<br>${Math.round(ctof(lo))}° / ${Math.round(ctof(hi))}°F</div><div class="nobleDay">${nobleFmt(lo)} / ${nobleFmt(hi)}<div class="weather">Noble</div></div></div>`}).join('')}catch(e){$('place').textContent=e.message==='Location not found'?'Location not found. Try a city or Canadian postal code.':'Could not load the forecast. Try again.'}}$('share').addEventListener('click',async()=>{const data={title:'NobleMeter',text:'Try the Sheldon Noble Temperature Conversion Scale',url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);alert('NobleMeter link copied.')}}catch(e){}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render(0);
</script></body></html>
