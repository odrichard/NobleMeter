<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050a10"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>NobleMeter</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#03070b,#09131c);color:#f5f7fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1080px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid #40505f;border-radius:25px;background:#07111acc;padding:20px;box-shadow:0 15px 45px #0008}.brand{font-size:clamp(27px,4vw,46px);font-weight:900;letter-spacing:1px}.sub{color:#a7b4c7;letter-spacing:2px;text-transform:uppercase;margin:2px 0 18px}.pulse{width:min(70vw,390px);aspect-ratio:1;margin:12px auto 20px;border-radius:50%;padding:12px;background:linear-gradient(135deg,#078cff,#ff222d);box-shadow:0 0 15px #ff2635,0 0 42px #ff1f2f99;animation:pulse 1.7s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 24px #ff2635,0 0 72px #ff1f2fcc;transform:scale(1.015)}}.dial{height:100%;border-radius:50%;background:radial-gradient(circle,#111923 0,#050b11 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid #172536}.noble{font-size:clamp(72px,14vw,120px);font-weight:900;line-height:.9;text-shadow:0 0 16px #ff3030}.unit{font-weight:900;color:#ff3a42;font-size:22px;letter-spacing:2px}.readout{color:#c8d2dd;margin-top:8px}.temps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{border:1px solid #3b4b59;border-radius:16px;padding:11px;text-align:center;background:#08131d}.box span{display:block;font-size:11px;color:#8fa1b4}.box input{width:100%;border:0;background:transparent;color:#fff;text-align:center;font-size:25px;font-weight:800;outline:0}.blue{color:#18a7ff!important}.red{color:#ff3d47!important}.slider{width:100%;margin:18px 0;accent-color:#ff313c}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;padding:13px;border-radius:14px;border:1px solid #536270;background:#050b11;color:white;font-size:16px}.search button,.btn{border:0;border-radius:14px;background:#087cff;color:white;font-weight:800;padding:13px 18px}.place{font-size:19px;font-weight:800;margin:18px 3px 10px}.days{display:grid;gap:8px}.day{border:1px solid #344552;border-radius:14px;padding:11px;display:grid;grid-template-columns:1.2fr 1fr 1fr;align-items:center;background:#07111a}.dayname{font-weight:900}.weather{font-size:11px;color:#a6b4c2}.temp{text-align:center;font-size:14px}.nobleDay{text-align:right;font-size:20px;font-weight:900}.share{width:100%;margin-top:14px;background:#111e29;border:1px solid #405565}.source{text-align:center;color:#65788a;font-size:9px;margin-top:10px}@media(max-width:760px){.grid{grid-template-columns:1fr}.panel{padding:16px}.pulse{width:min(74vw,330px)}.brand{text-align:center}.sub{text-align:center}.forecastTitle{font-size:25px}}</style></head><body><main class="app"><div class="grid"><section class="panel"><div class="brand">🔗 NOBLE METER</div><div class="sub">Temperature. In Noble terms.</div><div class="pulse"><div class="dial"><div id="noble" class="noble">—</div><div class="unit">NOBLE</div><div id="readout" class="readout">Loading current temperature…</div></div></div><div class="temps"><div class="box"><span>CELSIUS</span><input id="c" class="blue" type="number" step="0.1"></div><div class="box"><span>FAHRENHEIT</span><input id="f" type="number" step="0.1"></div><div class="box"><span>NOBLE</span><b id="smallN" class="red">—</b></div></div><input id="slider" class="slider" type="range" min="-50" max="38" value="0" step="0.1"><button id="share" class="btn share">Share NobleMeter</button></section><section class="panel"><div class="brand forecastTitle">7-DAY NOBLE FORECAST</div><div class="sub">Search a city or postal code</div><div class="search"><input id="location" value="Winnipeg" placeholder="City or Canadian postal code"><button id="go">Search</button></div><div id="place" class="place">Winnipeg, Manitoba, Canada</div><div id="days" class="days"><div class="weather">Loading forecast…</div></div><div class="source">Forecast data: Open-Meteo</div></section></div></main><script>const $=id=>document.getElementById(id),c=$('c'),f=$('f'),s=$('slider'),n=$('noble'),r=$('readout'),smallN=$('smallN');function snapZero(C){return Math.abs(C)<.05?0:C}function noble(C){C=snapZero(C);return C===0?0:C<0?C*2:C*(100/38)}function ctof(C){return C*9/5+32}function ftoc(F){return(F-32)*5/9}function fmt(x,d=1){return Number(snapZero(x).toFixed(d)).toString()}function nobleFmt(C){let N=Math.round(noble(C));return N===0?'0':(N>0?'+':'')+N}function render(rawC,src){if(!Number.isFinite(rawC))return;let C=snapZero(rawC),F=ctof(C),N=nobleFmt(C);n.textContent=N;smallN.textContent=N;r.textContent=`${fmt(C)}°C · ${fmt(F)}°F`;if(src!=='c')c.value=fmt(C);if(src!=='f')f.value=fmt(F);s.value=Math.max(-50,Math.min(38,C))}c.oninput=()=>render(Number(c.value),'c');f.oninput=()=>render(ftoc(Number(f.value)),'f');s.oninput=()=>render(Number(s.value),'s');const weatherNames={0:'☀ Clear',1:'☀ Mostly clear',2:'◐ Partly cloudy',3:'● Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Rain',63:'Rain',65:'Heavy rain',71:'❄ Snow',73:'❄ Snow',75:'❄ Heavy snow',80:'Showers',81:'Showers',82:'Heavy showers',85:'❄ Snow showers',86:'❄ Heavy snow',95:'⚡ Thunderstorm',96:'⚡ Thunderstorm',99:'⚡ Thunderstorm'};async function findLocation(q){let compact=q.toUpperCase().replace(/\s+/g,'');let isCanadian=/^[ABCEGHJ-NPRSTVXY]\d[ABCEGHJ-NPRSTVWXYZ]\d[ABCEGHJ-NPRSTVWXYZ]\d$/.test(compact);if(isCanadian){let pretty=compact.slice(0,3)+' '+compact.slice(3),z=await fetch(`https://api.zippopotam.us/CA/${encodeURIComponent(pretty)}`);if(!z.ok)z=await fetch(`https://api.zippopotam.us/CA/${encodeURIComponent(compact.slice(0,3))}`);if(z.ok){let j=await z.json(),p=j.places?.[0];if(p)return{latitude:+p.latitude,longitude:+p.longitude,label:[p['place name'],p.state,'Canada'].filter(Boolean).join(', ')}}}let g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`),gj=await g.json();if(!gj.results?.length)throw Error('Location not found');let p=gj.results[0];return{latitude:p.latitude,longitude:p.longitude,label:[p.name,p.admin1,p.country].filter(Boolean).join(', ')}}async function loadForecast(){let q=$('location').value.trim();if(!q)return;$('place').textContent='Finding '+q+'…';try{let p=await findLocation(q);$('place').textContent=p.label;let u=`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7`,w=await fetch(u),j=await w.json();if(Number.isFinite(j.current?.temperature_2m))render(j.current.temperature_2m);$('days').innerHTML=j.daily.time.map((date,i)=>{let hi=j.daily.temperature_2m_max[i],lo=j.daily.temperature_2m_min[i],d=new Date(date+'T12:00:00'),day=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}),wx=weatherNames[j.daily.weather_code[i]]||'Forecast';return `<div class="day"><div><div class="dayname">${day}</div><div class="weather">${wx}</div></div><div class="temp"><span class="blue">${Math.round(lo)}°C</span> / <span class="red">${Math.round(hi)}°C</span><br>${Math.round(ctof(lo))}° / ${Math.round(ctof(hi))}°F</div><div class="nobleDay"><span class="blue">${nobleFmt(lo)}</span> / <span class="red">${nobleFmt(hi)}</span><div class="weather">Noble</div></div></div>`}).join('')}catch(e){$('place').textContent='Could not load location. Try again.'}}$('go').onclick=loadForecast;$('location').onkeydown=e=>{if(e.key==='Enter')loadForecast()};$('share').onclick=async()=>{let data={title:'NobleMeter',text:'Try the Sheldon Noble Temperature Conversion Scale',url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);alert('NobleMeter link copied.')}}catch(e){}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');loadForecast();</script></body></html>
